services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shodhfund
      POSTGRES_PASSWORD: shodhfund-local-only
      POSTGRES_DB: shodhfund
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodhfund -d shodhfund"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shodhfund-postgres-data:/var/lib/postgresql/data

volumes:
  shodhfund-postgres-data:
